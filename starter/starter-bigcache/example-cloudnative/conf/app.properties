# Disable the built-in HTTP server; probes are served by the actuator.
spring.http.server.enabled=false

# --- BigCache instance -------------------------------------------------------
# bigcache is an in-process heap cache, so there is no address or pool to
# configure — only sizing and eviction knobs. One instance ("cache") is created
# from this map entry; the starter wires it as *ObservedBigCache (autowire:"cache")
# and auto-exports a health.Indicator under the same name.
spring.bigcache.cache.shards=256
spring.bigcache.cache.life-window=1m
spring.bigcache.cache.stats-enabled=true

# --- Resilience ------------------------------------------------------------
# Backend-neutral config: every bigcache Get/Set/Delete runs through the builtin
# "default" executor (the wrapper's gs.Dync[resilience.Config] is bound to the
# `resilience` prefix); a burst over rate-limit is rejected with ErrRateLimited.
# The policy is a gs.Dync, so it is hot-reloadable.
resilience.enabled=true
resilience.driver=default
resilience.rate-limit=5

# --- Health / actuator -----------------------------------------------------
# The per-instance bigcache health.Indicator is aggregated on :9370.
spring.actuator.enabled=true
spring.actuator.addr=:9370

# --- Dynamic configuration (file-watch) ------------------------------------
# demo.label lives in the watched mount; the example rewrites it and observes a
# hot reload with no restart.
spring.app.imports=file-watch:./mount/application.properties
