services:
  postgres:
    image: postgres:16
    container_name: starter-gorm-postgres-load
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_PASSWORD: "root"
      POSTGRES_DB: "load"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d load"]
      interval: 3s
      timeout: 3s
      retries: 30
