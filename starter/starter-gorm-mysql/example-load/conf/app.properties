spring.gorm.mysql.load.user=root
spring.gorm.mysql.load.password=root
spring.gorm.mysql.load.addr=127.0.0.1:3306
spring.gorm.mysql.load.db=load
spring.gorm.mysql.load.parseTime=true
spring.gorm.mysql.load.charset=utf8mb4

# Resilience (top-level resilience.* — absolute property ref shared across
# starters). A small breaker + 1 retry makes "放火" visible in the breakdown.
resilience.enabled=true
resilience.driver=default
resilience.error-threshold=20
resilience.open-duration=5s
resilience.max-retries=1
resilience.timeout=500ms

# Fault injection (top-level fault.*). OFF by default; flip to fire:
#   fault.enabled=true
#   fault.rate=0.5
#   fault.error=generic      # or: timeout / reset
fault.enabled=false
