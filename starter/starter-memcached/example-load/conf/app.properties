spring.memcached.load.servers=127.0.0.1:11211

# Governance (top-level ${govern} — absolute property ref shared across
# starters). A small breaker + 1 retry makes "放火" visible in the breakdown.
govern.enabled=true
govern.driver=default
govern.default.enabled=true
govern.default.error-threshold=20
govern.default.open-duration=5s
govern.default.max-retries=1
govern.default.timeout=500ms

# Fault injection (top-level fault.*). OFF by default; flip to fire:
#   fault.enabled=true
#   fault.rate=0.5
#   fault.error=generic      # or: timeout / reset
fault.enabled=false
