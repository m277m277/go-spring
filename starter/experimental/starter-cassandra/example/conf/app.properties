# The compose cluster runs without auth and is a single node.
spring.cassandra.a.hosts=127.0.0.1
spring.cassandra.a.consistency=local-quorum

# A second client against the same cluster shows the multi-instance wiring.
spring.cassandra.b.hosts=127.0.0.1

