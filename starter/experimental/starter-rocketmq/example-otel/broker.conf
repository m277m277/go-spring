# broker.conf for the example cluster: the broker must advertise an address
# the host-side client can reach, and auto-create the topic the example uses.
brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
deleteWhen=04
fileReservedTime=48
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
# Advertise the host-published address so clients on the host can dial the
# broker after resolving it through the name server.
brokerIP1=127.0.0.1
listenPort=10911
# The example publishes to a topic without creating it up front.
autoCreateTopicEnable=true
