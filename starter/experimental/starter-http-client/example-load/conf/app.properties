spring.http-client.load.addr=127.0.0.1:18080

# Note: Resilience/Fault for http-client are fields of the ctor-bound Config, so
# they live UNDER the instance prefix (not top-level like redigo's field-injected
# Dync). This example demonstrates fault in fault-only mode (resilience off):
# fault wraps a zero-policy executor and injects into the RoundTripper directly.
#
# To "set fire":
spring.http-client.load.fault.enabled=false
spring.http-client.load.fault.rate=0.5
spring.http-client.load.fault.error=generic      # or: timeout / reset
