name: gs-s3-example

services:
  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: minio-s3-example
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  # Create the bucket the example uses, then exit.
  initbucket:
    image: minio/mc:RELEASE.2024-08-13T05-33-17Z
    container_name: minio-s3-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin >/dev/null 2>&1; do sleep 1; done;
      mc mb --ignore-existing local/go-spring-example;
      echo bucket ready
      "
