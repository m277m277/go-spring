services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: starter-gorm-sqlserver-load
    ports:
      - "127.0.0.1:1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "RootRoot1"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -P RootRoot1 -C -Q 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
