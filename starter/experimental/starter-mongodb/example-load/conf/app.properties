spring.mongodb.load.uri=mongodb://127.0.0.1:27017
spring.mongodb.load.max-pool-size=100
spring.mongodb.load.server-selection-timeout=10s

# Resilience (top-level ${govern} — absolute property ref shared across
# starters). A small breaker + 1 retry makes "放火" visible in the breakdown.
govern.enabled=true
govern.driver=default
govern.default.enabled=true
govern.default.error-threshold=20
govern.default.open-duration=5s
govern.default.max-retries=1
govern.default.timeout=500ms

# Fault injection (govern.fault.*). OFF by default; flip to fire:
#   govern.fault.enabled=true
#   govern.fault.rate=0.5
#   govern.fault.error=generic      # or: timeout / reset
govern.fault.enabled=false
