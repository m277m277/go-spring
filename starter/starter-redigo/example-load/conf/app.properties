spring.redigo.load.addr=127.0.0.1:6379
spring.redigo.load.driver=DefaultDriver

# Resilience (top-level resilience.* — the Pool's ${resilience:=} field tag is
# an absolute property reference, shared across instances like in
# example-cloudnative). A small breaker + 1 retry makes the effect of "放火"
# visible: injected failures trip the breaker, which surfaces as ErrCircuitOpen
# in the load report.
resilience.enabled=true
resilience.driver=default
resilience.error-threshold=20
resilience.open-duration=5s
resilience.max-retries=1
resilience.timeout=500ms

# Fault injection (top-level fault.*, same absolute-reference convention).
# OFF by default. To "set fire", flip enabled to true and pick a rate/kind —
# with the breaker above on, expect the load report's injected/circuit counts to
# climb and p99 to rise as retries stack up:
#
#   fault.enabled=true
#   fault.rate=0.5
#   fault.error=generic      # or: timeout / reset
#
# Latency-only fault (slow downstream, no errors):
#   fault.enabled=true
#   fault.latency=50ms
fault.enabled=false
