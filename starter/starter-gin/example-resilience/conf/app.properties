# Disable Go-Spring's built-in HTTP server so the gin.Engine bean owns the port.
spring.http.server.enabled=false

# The gin app serves on :8081.
spring.gin.server.addr=:8081

# Inbound resilience admission. Enabled here with the builtin "default" driver
# at 5 QPS: a burst is shed with 429 (circuit-open -> 503). All knobs from the
# backend-neutral resilience.Config are available (rate-limit, burst,
# error-threshold, open-duration, max-concurrent, max-retries, ...).
spring.gin.server.resilience.enabled=true
spring.gin.server.resilience.driver=default
spring.gin.server.resilience.rate-limit=5
