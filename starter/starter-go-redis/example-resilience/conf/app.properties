# Disable the built-in HTTP server; this example only exercises the redis client.
spring.http.server.enabled=false

# A single redis instance named "cache" (the bean autowired by name in example.go).
spring.go-redis.cache.addr=127.0.0.1:6379

# Backend-neutral governance config. The same ${govern.default.*} keys drive every
# client starter via the centralized ${govern} center (hot-reloadable).
# rate-limit=5 caps sustained throughput; a burst is rejected with ErrRateLimited.
govern.enabled=true
govern.driver=default
govern.default.enabled=true
govern.default.rate-limit=5
